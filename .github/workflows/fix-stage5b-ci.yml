name: Fix Stage 5B CI

on:
  push:
    branches: [stage-05b-idsa]

permissions:
  contents: write

concurrency:
  group: fix-stage-05b-ci
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-05b-idsa
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/fix_stage5b_ci.py
      - run: python -m pip install ruff black
      - run: ruff check --fix src tests examples tools
      - run: black src tests examples tools
      - name: Commit source repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests tools .stage5b-ci-fix-complete
          git commit -m "fix: support tuple strata in IDSA spatial decomposition"
          git pull --rebase origin stage-05b-idsa
          git push origin HEAD:stage-05b-idsa
