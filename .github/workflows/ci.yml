name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-stage5b:
    if: github.event_name == 'pull_request' && github.head_ref == 'stage-05b-idsa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-05b-idsa
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run deterministic cleanup
        run: |
          if [ ! -f tools/cleanup_stage5b_docs.py ]; then
            echo "Cleanup script is not present yet"
            exit 0
          fi
          python tools/cleanup_stage5b_docs.py
      - name: Commit cleanup
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No cleanup changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: normalize and finalize Stage 5B release"
          git pull --rebase origin stage-05b-idsa
          git push origin HEAD:stage-05b-idsa
