name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fix-stage6a:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-06-information-ssh
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff black
      - name: Replace fragile tuple-index assertion
        shell: python
        run: |
          from pathlib import Path

          path = Path("tests/test_srsgd.py")
          text = path.read_text(encoding="utf-8")
          old = '''    frame = result.to_frame().set_index("added_features")

    a2 = frame.loc[("a2",)]
    assert a2["power_gain"] == pytest.approx(
        0.8143939393939393 - 0.7325757575757575
    )
    assert a2["heterogeneity_change"] == "decreased"

    a3 = frame.loc[("a3",)]
    assert a3["power_gain"] == pytest.approx(0.0)
    assert a3["p_value"] == pytest.approx(1.0)
    assert a3["heterogeneity_change"] == "unchanged"
'''
          new = '''    by_added = {
        comparison.added_features: comparison
        for comparison in result.comparisons
    }

    a2 = by_added[("a2",)]
    assert a2.power_gain == pytest.approx(
        0.8143939393939393 - 0.7325757575757575
    )
    assert a2.heterogeneity_change == "decreased"

    a3 = by_added[("a3",)]
    assert a3.power_gain == pytest.approx(0.0)
    assert a3.p_value == pytest.approx(1.0)
    assert a3.heterogeneity_change == "unchanged"
'''
          if old not in text:
              raise SystemExit("expected test block was not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
      - run: ruff check --fix src tests examples tools
      - run: black src tests examples tools
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests examples tools
          git commit -m "style: clean Stage 6A implementation"
          git push origin HEAD:stage-06-information-ssh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pytest --cov=pygeohet --cov-report=term-missing

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests examples tools
      - run: black --check src tests examples tools
      - run: mypy src/pygeohet
      - run: python examples/01_factor_detector.py
      - run: python examples/02_classic_workflow.py
      - run: python examples/03_stratification_opgd.py
      - run: python examples/04_spatial_scale_opgd.py
      - run: python examples/05_multiscale_discretization.py
      - run: python examples/06_robust_detectors.py
      - run: python examples/07_spade.py
      - run: python examples/08_idsa.py
      - run: python examples/09_srsgd.py
      - run: python -m build
