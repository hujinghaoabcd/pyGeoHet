name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-stage6b:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-06b-information-consistency
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/update_stage6b_docs.py
      - name: Commit documentation synchronization
        run: |
          if git diff --quiet; then
            echo "No documentation changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ROADMAP.md MODEL_INVENTORY.md PROJECT_STRUCTURE.md VALIDATION_MATRIX.md DECISIONS.md CHANGELOG.md PROJECT_STATUS.md HANDOFF_NEXT_CONVERSATION.md THIRD_PARTY_NOTICES.md docs/references/stage6-information-ssh-audit.md
          git commit -m "docs: synchronize Stage 6B project records"
          git push origin HEAD:stage-06b-information-consistency

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pytest --cov=pygeohet --cov-report=term-missing

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests examples tools
      - run: black --check src tests examples tools
      - run: mypy src/pygeohet
      - run: python examples/01_factor_detector.py
      - run: python examples/02_classic_workflow.py
      - run: python examples/03_stratification_opgd.py
      - run: python examples/04_spatial_scale_opgd.py
      - run: python examples/05_multiscale_discretization.py
      - run: python examples/06_robust_detectors.py
      - run: python examples/07_spade.py
      - run: python examples/08_idsa.py
      - run: python examples/09_srsgd.py
      - run: python examples/10_information_consistency.py
      - run: python -m build
