name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finalize-stage5b:
    if: github.event_name == 'pull_request' && github.head_ref == 'stage-05b-idsa' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-05b-idsa
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Repair temporary finalizer
        run: sed -i 's/roadmap = read("ROADMAP.md")n = None/roadmap = read("ROADMAP.md")/' tools/finalize_stage5b_docs.py
      - run: python tools/finalize_stage5b_docs.py
      - run: python tools/fix_stage5b_readmes.py
      - run: python -m pip install ruff black
      - run: ruff check --fix src tests examples tools
      - run: black src tests examples tools
      - name: Commit finalized files
        run: |
          if git diff --quiet; then
            echo "No finalization changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh.md CHANGELOG.md DECISIONS.md VALIDATION_MATRIX.md MODEL_INVENTORY.md ROADMAP.md PROJECT_STRUCTURE.md THIRD_PARTY_NOTICES.md HANDOFF_NEXT_CONVERSATION.md src tests examples tools
          git commit -m "docs: finish Stage 5B README synchronization"
          git push origin HEAD:stage-05b-idsa

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pytest --cov=pygeohet --cov-report=term-missing

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests examples tools
      - run: black --check src tests examples tools
      - run: mypy src/pygeohet
      - run: python examples/01_factor_detector.py
      - run: python examples/02_classic_workflow.py
      - run: python examples/03_stratification_opgd.py
      - run: python examples/04_spatial_scale_opgd.py
      - run: python examples/05_multiscale_discretization.py
      - run: python examples/06_robust_detectors.py
      - run: python examples/07_spade.py
      - run: python examples/08_idsa.py
      - run: python -m build
