name: Finalize Stage 5B

on:
  push:
    branches: [stage-05b-idsa]

permissions:
  contents: write

concurrency:
  group: finalize-stage-05b
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-05b-idsa
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/finalize_stage5b_docs.py
      - run: python -m pip install ruff black
      - run: ruff check --fix src tests examples tools
      - run: black src tests examples tools
      - name: Commit finalized Stage 5B files
        run: |
          if git diff --quiet; then
            echo "No finalization changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh.md CHANGELOG.md DECISIONS.md VALIDATION_MATRIX.md MODEL_INVENTORY.md ROADMAP.md PROJECT_STRUCTURE.md THIRD_PARTY_NOTICES.md HANDOFF_NEXT_CONVERSATION.md src tests examples tools
          git commit -m "docs: finalize Stage 5B IDSA release"
          git push origin HEAD:stage-05b-idsa
